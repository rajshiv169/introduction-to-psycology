<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Introduction to Psychology</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f0f8ff;
      max-width: 900px;
      margin: auto;
    }
    h1 {
      text-align: center;
    }
    .question {
      margin-bottom: 25px;
      padding: 15px;
      background: #fff;
      border-left: 5px solid #007BFF;
      border-radius: 5px;
    }
    .question p {
      margin-bottom: 10px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    .result {
      font-weight: bold;
      margin-top: 10px;
    }
    .correct {
      color: green;
    }
    .wrong {
      color: red;
    }
    .solution {
      font-style: italic;
      margin-top: 5px;
    }
    button {
      padding: 10px 20px;
      margin-top: 30px;
      display: block;
      margin-left: auto;
      margin-right: auto;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Introduction to Psychology</h1>

<form id="quizForm">

  <!-- Questions will be generated here -->
</form>

<button onclick="checkAnswers()">Submit Answers</button>

<script src="index.js"></script>
</body>
</html>
